    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
        }
        .glitch-text {
            position: relative;
            display: inline-block;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .glitch-text:hover {
            animation: glitch-jitter 0.15s infinite alternate;
        }
        .glitch-text:hover::before {
            left: 3px;
            text-shadow: -2px 0 red;
            animation: glitch-anim-1 0.2s infinite linear alternate-reverse;
        }
        .glitch-text:hover::after {
            left: -3px;
            text-shadow: 2px 0 cyan;
            animation: glitch-anim-2 0.3s infinite linear alternate-reverse;
        }
        @keyframes glitch-jitter {
             0% { transform: translateX(0); }
            100% { transform: translateX(2px); }
        }
        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 20% 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); }
            20% { clip-path: inset(30% 0 20% 0); }
            40% { clip-path: inset(70% 0 10% 0); }
            60% { clip-path: inset(20% 0 50% 0); }
            80% { clip-path: inset(50% 0 30% 0); }
            100% { clip-path: inset(5% 0 80% 0); }
        }
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(26,26,26,0.8) 100%);
        }
        .fade-in-out {
            animation: fadeInOut 2s ease-in-out forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 1; }
            30% { opacity: 1; }
            100% { opacity: 0; display: none; pointer-events: none; }
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex md:flex-row select-none">
<!-- Efecto de transición -->
<div class="fixed inset-0 bg-black z-[100] fade-in-out"></div>

<script>
    const logo = document.querySelector('.logo-flicker');
    if (logo) {
        setInterval(() => {
            if (Math.random() > 0.95) {
                logo.style.opacity = Math.random() * 0.5 + 0.5;
                setTimeout(() => {
                    logo.style.opacity = 0.9;
