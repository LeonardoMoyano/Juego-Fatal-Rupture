    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
        }
        .glitch-effect {
            position: relative;
            display: inline-block;
        }

        .group:hover .glitch-effect::before,
        .group:hover .glitch-effect::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: none;
        }

        .group:hover .glitch-effect::before {
            left: 2px;
            text-shadow: -2px 0 rgba(255, 0, 0, 0.8);
            animation: glitch-anim-1 0.2s infinite linear alternate-reverse;
        }

        .group:hover .glitch-effect::after {
            left: -2px;
            text-shadow: 2px 0 rgba(0, 255, 255, 0.8);
            animation: glitch-anim-2 0.3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); opacity: 0.8; }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); opacity: 0.5; }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); opacity: 0.9; }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); opacity: 1; }
            20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); opacity: 0.8; }
            40% { clip-path: inset(30% 0 20% 0); transform: translate(2px, 1px); opacity: 1; }
            60% { clip-path: inset(50% 0 30% 0); transform: translate(-1px, -2px); opacity: 0.9; }
            80% { clip-path: inset(5% 0 80% 0); transform: translate(2px, 2px); opacity: 1; }
            100% { clip-path: inset(40% 0 10% 0); transform: translate(-2px, -1px); opacity: 0.8; }
        }
        
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 50;
        }
        .vignette {
            box-shadow: 0 0 200px rgba(0,0,0,0.9) inset;
        }
        
        .fade-in-out {
            animation: fadeInOut 2s ease-in-out forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 1; }
            30% { opacity: 1; }
            100% { opacity: 0; display: none; pointer-events: none; }
        }

        .difficulty-btn.active {
            border-left-width: 4px;
            border-left-color: theme('colors.secondary-fixed');
            background-color: rgba(146, 7, 3, 0.3); /* secondary-container/30 */
            padding-left: theme('spacing.stack-sm');
        }
        .difficulty-btn.active .btn-text {
            color: theme('colors.secondary-fixed-dim') !important;
        }
        .difficulty-btn:not(.active) .btn-text {
            color: theme('colors.on-surface-variant');
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden relative select-none">
<!-- Fondo -->
<div class="absolute inset-0 z-0 vignette bg-cover bg-center" style="background-image: url('fondo_menu.jpg');">

    <div class="crt-overlay absolute inset-0"></div>
</div>
<main class="relative z-10 h-full flex flex-col justify-center px-margin-safe max-w-7xl mx-auto">
    <div class="absolute top-margin-safe left-margin-safe z-20">
        <a href="menu.html" class="group relative flex items-center gap-stack-sm p-stack-sm border border-outline/20 bg-surface-container-low/50 hover:bg-surface-container-highest/50 transition-all duration-150 text-left overflow-hidden scale-110">

            <div class="absolute inset-0 border border-secondary opacity-0 group-hover:opacity-20 animate-pulse pointer-events-none"></div>

                        <span class="pipe-icon font-bold text-secondary-fixed-dim text-headline-lg-mobile">|</span>
                        <span class="btn-text font-bold text-headline-lg-mobile tracking-[0.2em] glitch-effect uppercase group-hover:text-primary transition-colors" data-text="FÁCIL">FÁCIL</span>
                    </div>

                </button>
                <button class="difficulty-btn group relative flex items-center justify-between p-stack-sm border border-outline/20 bg-surface-container-low/50 hover:bg-surface-container-highest/50 transition-all duration-150 text-left overflow-hidden h-20">
                    <div class="flex items-center gap-stack-sm">
                        <span class="pipe-icon font-bold text-secondary-fixed-dim text-headline-lg-mobile">||</span>
                        <span class="btn-text font-bold text-headline-lg-mobile tracking-[0.2em] glitch-effect uppercase group-hover:text-primary transition-colors" data-text="NORMAL">NORMAL</span>
                    </div>
                    <div class="absolute inset-0 border border-secondary opacity-0 group-hover:opacity-20 animate-pulse pointer-events-none"></div>
                </button>
                <button class="difficulty-btn group relative flex items-center justify-between p-stack-sm border border-outline/20 bg-surface-container-low/50 hover:bg-surface-container-highest/50 transition-all duration-150 text-left overflow-hidden h-20 active">
                    <div class="flex items-center gap-stack-sm">
                        <span class="pipe-icon font-bold text-secondary-fixed-dim text-headline-lg-mobile">|||</span>
                        <span class="btn-text font-bold text-headline-lg-mobile tracking-[0.2em] glitch-effect uppercase group-hover:text-primary transition-colors" data-text="DIFÍCIL">DIFÍCIL</span>
                    </div>
                    <div class="absolute inset-0 border border-error opacity-0 group-hover:opacity-20 animate-pulse pointer-events-none"></div>
                </button>
            </div>
        </div>
        <div class="hidden md:block col-span-7 lg:col-span-8"></div>
    </div>
    <div class="absolute bottom-margin-safe left-0 w-full flex justify-center z-20 pointer-events-none">
        <button class="pointer-events-auto group relative overflow-hidden border border-outline bg-surface-container-low px-stack-lg py-stack-md transition-all duration-300 hover:border-secondary hover:bg-secondary-container/20 scale-125">
            <!-- Efecto de Glitch -->
            <div class="absolute inset-0 bg-secondary/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
            <div class="relative flex items-center gap-stack-md">
                <span class="font-bold text-headline-lg-mobile md:text-headline-lg text-primary group-hover:text-secondary-fixed uppercase tracking-tighter glitch-effect" data-text="INICIAR PARTIDA">INICIAR PARTIDA</span>
            </div>
            <div class="absolute top-0 left-0 w-1 h-1 bg-outline group-hover:bg-secondary transition-colors"></div>
            <div class="absolute bottom-0 right-0 w-1 h-1 bg-outline group-hover:bg-secondary transition-colors"></div>
        </button>
    </div>
</main>
<script>
    const buttons = document.querySelectorAll('.difficulty-btn');
    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        });
    });
</script>
